# ---------------------------------------------------------------------------
# Gaia configuration.
#
# Committed to version control. Describes *what* Gaia does.
# Secrets are NOT here: ${VAR} placeholders are resolved from .env at load time
# by pydantic-settings. Never hard-code a credential in this file.
# ---------------------------------------------------------------------------

app:
  name: gaia
  locale: en
  default_target: demo_mssql
  log_level: INFO

targets:
  demo_mssql:
    dialect: mssql                # registry key -> MetadataReader/Profiler/SqlGuard
    # Use the literal IPv4 address. "localhost" can resolve to ::1, while the
    # SQL Server container publishes only on 127.0.0.1, so the ODBC handshake
    # stalls and fails with HYT00 "Login timeout expired".
    host: ${GAIA_TARGET_HOST}
    port: 1433
    database: ${GAIA_TARGET_DATABASE}
    username: ${GAIA_TARGET_USER}
    password: ${GAIA_TARGET_PASSWORD}
    options:
      driver: ODBC Driver 18 for SQL Server
      encrypt: true
      trust_server_certificate: true
      app_name: gaia
    limits:
      # Applied by Gaia to every session it opens, in addition to the login's
      # own restrictions.
      connect_timeout_s: 15
      statement_timeout_s: 30
      lock_timeout_ms: 5000
      max_sample_rows: 200         # Phase 1 legacy, unused; profiling uses profiling.budget
      max_runtime_per_table_s: 120 # Phase 1 legacy, unused; profiling uses profiling.budget
      max_rows_returned: 1000
      isolation: read_uncommitted
    capabilities:
      extended_properties: true   # MS_Description comments readable
      dmv_row_counts: true        # VIEW DATABASE STATE granted
      show_statistics: false      # DBCC SHOW_STATISTICS needs elevation

  # PostgreSQL development target (D25): a synthetic retail database generated
  # by infra/pg-target/seed.py (`make pg-target-up pg-target-seed`). It is a
  # separate server from Gaia's metadata store, never the same database.
  # Select it per command with --target demo_pg (or TARGET=demo_pg in make).
  demo_pg:
    dialect: postgres             # alias: postgresql
    host: ${GAIA_PG_TARGET_HOST:-127.0.0.1}
    port: ${GAIA_PG_TARGET_PORT:-5434}
    database: ${GAIA_PG_TARGET_DATABASE:-gaia_target_pg}
    username: ${GAIA_PG_TARGET_USER:-gaia_ro}
    password: ${GAIA_PG_TARGET_PASSWORD}
    options:
      sslmode: prefer             # libpq sslmode
      app_name: gaia
    limits:
      connect_timeout_s: 15
      statement_timeout_s: 30     # enforced per session (SET statement_timeout)
      lock_timeout_ms: 5000
      max_sample_rows: 200         # Phase 1 legacy, unused; profiling uses profiling.budget
      max_runtime_per_table_s: 120 # Phase 1 legacy, unused; profiling uses profiling.budget
      max_rows_returned: 1000
      isolation: read_uncommitted # no PostgreSQL equivalent; catalog reads use REPEATABLE READ
    # SQL Server capability flags; not used by the PostgreSQL dialect.

llm:
  provider: deepseek              # deepseek | ollama
  # OpenAI-compatible endpoint; the client appends /chat/completions.
  base_url: ${GAIA_LLM_BASE_URL}
  model: ${GAIA_LLM_MODEL}
  api_key: ${DEEPSEEK_API_KEY}
  json_mode: true
  max_output_tokens: 16000
  temperature: 0.1
  # The gateway hard-limits this account to 4 concurrent requests per model.
  # Stay one below it so a retry never has to fight for the last slot.
  # Per command: GAIA_LLM_CONCURRENCY=2 make … — two jobs at 2 each share the cap of 4.
  concurrency: ${GAIA_LLM_CONCURRENCY:-3}
  # Read timeout per completion. Thinking-mode calls return nothing until the
  # full answer is ready, so this is sized for the widest bundle, not a typical
  # one. The current provider is slow by nature; re-assess on provider change.
  timeout_s: 1800
  # Phase 3B. Prompts larger than this are split into column chunks (D17').
  context_budget_tokens: 32000
  # Where the model runs (D24). remote: data values reach the model only as
  # shapes for personal-data and high-cardinality text columns.
  locality: remote
  # replay_dir: /path   # with provider: replay (or `make reason ARGS="--replay DIR"`)
  thinking:
    # Thinking is on by default in DeepSeek; disable where latency matters more
    # than depth.
    semantics: true
    critique: true
    sql_generation: false
    repair: false
    classification: false
    answer: false
  retry:
    max_attempts: 3
    max_attempts_rate_limit: 8    # 429 = concurrency ceiling; clears on its own
    # A read timeout has already burned llm.timeout_s, so retry it once only.
    max_attempts_timeout: 2
    backoff_base_s: 2.0
    max_backoff_s: 60.0
    retry_on_blank_content: true  # JSON mode can return whitespace only

embeddings:
  provider: ollama
  base_url: ${GAIA_EMBEDDINGS_BASE_URL}
  model: ${GAIA_EMBEDDINGS_MODEL}
  dimensions: ${GAIA_EMBEDDINGS_DIMENSIONS}
  # The 4 GB GPU is occupied by the coder model; keep embeddings on CPU.
  num_gpu: 0
  batch_size: 32
  timeout_s: 120

cache:
  redis_url: ${GAIA_REDIS_URL}
  ttl_s:
    llm: 2592000          # 30 days
    embedding: 2592000    # 30 days
    profile: 604800       # 7 days
    chat_answer: 900      # 15 minutes
    lock: 600             # 10 minutes

profiling:
  # Phase 3A. On: evidence is collected from the target (make profile) and used
  # by reasoning. Off (or targets.<name>.profiling_enabled: false): catalog
  # evidence is all there will be, so columns below accept_at go straight to
  # the review queue.
  enabled: true
  # "HH:MM-HH:MM" host local time, may wrap midnight; after the target's
  # statistics maintenance (A5). targets.<name>.profiling_window overrides it.
  window: null
  # Re-profile when the structure changed, the row count moved more than
  # row_count_delta_ratio, or the profile is older than this (P3-6).
  profile_max_age_days: 30
  row_count_delta_ratio: 0.20
  seed: 42                      # TABLESAMPLE ... REPEATABLE(seed)
  budget:                       # P3-5; placeholders until the SQL Server 3.0 measurement
    full_scan_max_pages: 12800  # <= ~100 MB: everything exact
    scan_max_pages: 1000000     # one batched exact scan allowed up to ~8 GB
    sample_target_rows: 10000
    max_sample_rows: 20000
    low_cardinality_max: 1000   # exact GROUP BY top-k below this many values
    max_pages_per_table: 2000000
    max_pages_per_run: 50000000
    max_runtime_per_table_s: 180
    statement_timeout_s: 60
    # D50: adaptive = plan a statement at twice the slowest so far on the table
    # (min 5 s); strict = at its full timeout (a hard ceiling, some budget unused)
    time_rule: adaptive
    maxdop: 2                   # PostgreSQL: max_parallel_workers_per_gather
    work_mem_mb: null           # PostgreSQL only
    max_join_tests: 500
    join_test_values: 200
  # Development override for synthetic data only: raw values to a remote model.
  allow_raw_to_remote: false
  # Text columns with at most this many distinct values count as codes; their
  # values stay readable in masked mode unless a detector flags personal data.
  code_max_distinct: 50
  # Confidence bands; see OUTLINE.md §12.
  accept_at: 0.80
  deep_profile_below: 0.60
  review_required_below: 0.45

scoring:
  # heuristic-v2 (Phase 3B, P3-2): evidence ledger. heuristic-v1: Phase 2.
  version: heuristic-v2
  v2:
    weights:                    # sum = 1.0
      evidence_support: 0.35    # noisy-OR(supporting) x (1 - noisy-OR(contradicting))
      coherence: 0.20           # claim vs catalog and data checks
      counter_evidence: 0.20    # critique verdict
      hypothesis_margin: 0.15
      model_self_report: 0.10
    # Evidence strengths: placeholders until Phase 6 calibrates on SME labels.
    # All keys: gaia.core.config.EvidenceStrengths. A name is never evidence.
    strengths:
      comment: 0.60
      foreign_key_trusted: 0.60
      key: 0.50
      check_trusted: 0.50
      detector_strong: 0.70
      test_passed: 0.70
      profile_check: 0.25
      profile_check_failed: 0.50
      test_failed: 0.80
  # --- heuristic-v1 (Phase 2) -----------------------------------------------
  # Heuristic weights, sum = 1.0. Replace with a fitted calibrator once SME
  # reviews exist; the weights version is stored with every score.
  weights_version: heuristic-v1
  weights:
    evidence_coverage: 0.30
    schema_coherence: 0.25
    hypothesis_margin: 0.20
    counter_evidence: 0.15
    model_self_report: 0.10
  # Sub-weights of evidence_coverage, sum = 1.0. Earned from catalog facts
  # about the column only. "profile" is earned by Phase 3 deep profiling, so in
  # Phase 2 evidence_coverage tops out at 0.75 even for a commented column.
  evidence_signals:
    comment: 0.30
    foreign_key: 0.15
    key: 0.10
    check_constraint: 0.10
    default: 0.05
    identity_or_computed: 0.05
    profile: 0.25
  # counter_evidence value per critique verdict.
  critique_verdicts:
    supported: 1.0
    plausible: 0.7
    doubtful: 0.35
    contradicted: 0.0
    not_assessed: 0.5     # critique failed or skipped the column
  # Runner-up confidence assumed when the model lists no alternatives.
  margin_prior_alternative: 0.2
  calibrator: identity    # Phase 6 replaces this with a fitted calibrator

semantics:
  validation_retries: 1         # re-ask with the validation errors, then fail
  embed_after_reasoning: true
  # 2 = Phase 3B prompts (evidence block, semantic_type); 1 = Phase 2 prompts.
  # Changing it changes the prompt versions, so every table is re-reasoned once.
  prompt_major: 2
  # P6-5: 10 % of the review items are shown without Gaia's certainty (score, band, "not
  # sure"), so 6B can measure whether people follow it. 0 turns it off.
  review_blind_share: 0.10

calibration:
  # Phase 6C (P6-1): a fitted calibrator may replace the identity only with enough labels
  # from people — isotonic from 150 with at least 30 not right, Platt scaling from 75 (15).
  # `make calibrate` fits and judges on held-out labels; `--apply` puts one in use.
  isotonic_min_labels: 150
  isotonic_min_wrong: 30
  platt_min_labels: 75
  platt_min_wrong: 15
  folds: 5
  bins: 10
  # P6-3: a meaning is accepted when P(right) >= 0.90 and the lower bound >= 0.80
  accept_p: 0.90
  accept_lower: 0.80
  # 6D (P6-2): an answer is "high" when P(right) >= 0.95, "medium" from 0.75
  answer_high: 0.95
  answer_medium: 0.75
  # P6-9 (2026-11-18): a provider's renames — labels under an earlier name count for the
  # model as it is called now. Only a rename: a different model is never an alias.
  model_aliases:
    deepseek-v4.1-flash: deepseek-flash            # renamed on 2026-11-16 (§21f, Q3)
    deepseek/deepseek-v4.1-flash: deepseek-flash   # the same, with the gateway's provider prefix

retrieval:
  # Phase 4B: what a question's schema context may hold (see gaia.query.retrieval).
  max_objects: 6              # objects found by relevance; bridges on join paths come on top
  max_bridges: 3
  max_expansions: 2           # implied objects: the facts behind a ranking, the dates of facts
  max_join_hops: 3
  relative_cutoff: 0.25       # objects scoring below this share of the best one are dropped
  all_columns_up_to: 20       # objects with at most this many columns are shown whole
  max_columns_per_object: 25
  context_budget_tokens: 6000
  vector_k: 40                # nearest meanings from the embeddings

datasources:
  # Phase 4F (OUTLINE §24). Data sources added at runtime (make datasource) are usable
  # only if their read-only probe passed within this many days.
  reprobe_days: 30
  # (admin_api is no longer read: since Phase 5A the admin role guards /api/admin/*)

auth:
  # Phase 5A (D68). Directories (AD/LDAP; Entra ID in 5A.2) are added by an administrator
  # (make auth ARGS="directory add …" or the admin screen) and stored encrypted.
  session_idle_minutes: 30
  session_max_hours: 8
  recheck_minutes: ${GAIA_AUTH_RECHECK_MINUTES:-15}   # the directory is asked again while a session lasts
  cookie_secure: ${GAIA_COOKIE_SECURE:-false}   # true once behind TLS (P5-9)
  setup_code_minutes: 30         # the local administrator's one-time setup code
  local_admin_enabled: true      # the one local account, for setup and break-glass
  max_failed_sign_ins: 5
  lockout_minutes: 15
  # who may chat; every one of them only within their data categories (need-to-know, 5C)
  chat_roles: [user, sme, admin]

chat:
  # Phase 4E. Result rows stored with an answer (chat.message), personal-data columns
  # masked in the stored copy; the live response carries every row (up to query.row_limit).
  keep_rows: 200
  # Earlier turns a follow-up question ("and in 2024?") is read with.
  history_turns: 3

query:
  max_repair_attempts: 2
  # Rows returned at most; the smaller of this and targets.<name>.limits.max_rows_returned.
  row_limit: 1000
  # Phase 4A: a join with no declared FK, tested model hint (D48), SME hint or view
  # lineage behind it is rejected. "warn" only reports it (not recommended).
  unverified_joins: reject
  # Phase 4C: result rows the narrative model sees (personal data hidden for a remote model)
  rows_to_model: 30
  # "today" for relative periods ("last month"); null = the real date
  as_of: null
  # Informational: the SQL guard's rules are fixed in code (gaia.query.validator and
  # dialects/<d>/guard.py: SELECT/WITH only, function allowlists) and not read from here.
  allowed_statements: [select, with]
  forbid:
    - xp_cmdshell
    - openrowset
    - opendatasource
    - openquery
    - bulk_insert
    - exec
    - insert
    - update
    - delete
    - merge
    - drop
    - alter
    - truncate
    - create
