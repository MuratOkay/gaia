[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia"
version = "0.1.0"
description = "Metadata-driven semantic agent: introspect, reason, score, and answer business questions in SQL"
license = "MIT"
authors = [{ name = "Murat Okay", email = "murat.okay@superonline.com" }]
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # Config / models
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Metadata store (PostgreSQL 18 + pgvector)
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3.5",
    # Target database (SQL Server 2025 via ODBC Driver 18)
    "pyodbc>=5.2",
    # LLM + embeddings
    "httpx>=0.27",
    # SQL parsing / AST validation
    "sqlglot>=25.30",
    # Phase 4F: AES-GCM encryption of data-source credentials (P4-6)
    "cryptography>=42",
    # Phase 5A: Active Directory / LDAP(S) sign-in; the local account's password (D68)
    "ldap3>=2.9",
    "argon2-cffi>=23.1",
    # Phase 5A.2: Entra ID — validating the ID token (RS256 against the tenant's keys)
    "pyjwt[crypto]>=2.8",
    # Cache + jobs
    "redis>=5.1",
    "arq>=0.26",
    # Observability
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.11",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaia = ["prompts/*.txt", "prompts/*.md", "semantics/prompts/*.md", "query/prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["../tests"]
# ldap3 2.9 imports names pyasn1 has deprecated; nothing Gaia can change
filterwarnings = ["ignore::DeprecationWarning:ldap3.utils.asn1"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RET"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Measurement and profiling statements are assembled from catalog identifiers,
# quoted and escaped by the dialect (quote()); values travel as parameters; no
# user-supplied text reaches them.
"src/gaia/dialects/*/measure.py" = ["S608"]
"src/gaia/dialects/*/profiler.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
packages = ["gaia"]
strict = false
warn_unused_ignores = true
