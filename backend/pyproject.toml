[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia"
version = "0.1.0"
description = "Metadata-driven semantic agent: introspect, reason, score, and answer business questions in SQL"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # Config / models
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Metadata store (PostgreSQL 18 + pgvector)
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3.5",
    # Target database (SQL Server 2025 via ODBC Driver 18)
    "pyodbc>=5.2",
    # LLM + embeddings
    "httpx>=0.27",
    # SQL parsing / AST validation
    "sqlglot>=25.30",
    # Cache + jobs
    "redis>=5.1",
    "arq>=0.26",
    # Observability
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.11",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaia = ["prompts/*.txt", "prompts/*.md", "semantics/prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["../tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RET"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
packages = ["gaia"]
strict = false
warn_unused_ignores = true
