# ---------------------------------------------------------------------------
# Gaia infrastructure: metadata store + cache only.
#
# The target SQL Server (container "sql1", localhost:1433) and the Ollama
# runtime (container "ollama-code", localhost:11435) are owned externally and
# deliberately NOT managed here.
#
#   docker compose up -d
#   docker compose ps
# ---------------------------------------------------------------------------

services:
  gaia-metadata-db:
    image: pgvector/pgvector:pg18
    container_name: gaia-metadata-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GAIA_METADATA_DB:-gaia}
      POSTGRES_USER: ${GAIA_METADATA_USER:-gaia}
      POSTGRES_PASSWORD: ${GAIA_METADATA_PASSWORD:?set GAIA_METADATA_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: UTC
      PGTZ: UTC
    # pgvector:pg18 sets PGDATA=/var/lib/postgresql/18/docker, so the volume
    # must cover its parent directory.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=1000
      - -c
      - timezone=UTC
    ports:
      - "127.0.0.1:${GAIA_METADATA_PORT:-5433}:5432"
    volumes:
      - gaia-pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  gaia-redis:
    image: redis:8-alpine
    container_name: gaia-redis
    restart: unless-stopped
    # Ephemeral by design: Gaia must survive a Redis flush without losing
    # knowledge, so persistence is intentionally disabled.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:${GAIA_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  gaia-pgdata:
    name: gaia-pgdata
