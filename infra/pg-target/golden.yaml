  - id: c05
    question: What is our return rate?
    expect: clarify
    notes: orders or units; which period; does a cancelled order count
    clarified: the share of the orders placed in 2025, cancelled ones excluded, whose status is returned, as a percentage with two decimals
    objects: [sales.orders]
