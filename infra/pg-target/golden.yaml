  - id: c06
    question: How much did we sell last quarter?
    expect: clarify
    notes: amount or units; "last quarter" is the fourth quarter of 2025 (as_of 2026-01-15)
    clarified: the total order amount of October to December 2025, cancelled orders excluded
    objects: [sales.orders]
    sql: |
      SELECT sum(total_amount) AS total_amount FROM sales.orders
      WHERE order_date >= DATE '2025-10-01' AND order_date < DATE '2026-01-01'
        AND status <> 'cancelled'

  - id: c07
    question: Which city has the most customers?
    expect: clarify
    notes: the city of an address, of the preferred store, or of the legacy master?
    clarified: by the city of the customers' billing addresses (type B), each customer counted once, the top city only
    objects: [crm.addresses]
    rank_by: customers
    sql: |
      SELECT city, count(DISTINCT customer_id) AS customers
      FROM crm.addresses WHERE address_type = 'B'
      GROUP BY city ORDER BY customers DESC LIMIT 1

