- id: d12
  status: draft
  question: What percentage of all web page views in 2015 were made through a web account whose customer
    is currently active? Give the percentage as a number rounded to 2 decimals; page views with no linked
    account, or whose account has no customer record, count in the total but not in the active part.
  expect: answer
  objects: [dbo.customers, web.accounts, web.page_views]
  notes: Customer status is a current-state flag, not the status at the time of the page view; unlinked
    page views are kept in the denominator by the outer joins.
