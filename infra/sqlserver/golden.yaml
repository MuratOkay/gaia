- id: d17
  status: draft
  question: For game sales that occurred in 2015, what was the average number of days between the game's
    first release date and the sale date, rounded to 2 decimals? Count only sales of games whose first
    release date is on or before the sale date, so no negative gaps are included.
  expect: answer
  objects: [dw.dim_product, dw.fact_sales]
  notes: first_release_date runs beyond 2015 (up to 2027), so sales preceding the release date are excluded;
    the sale date is taken from the integer date key, not the timestamp.
  sql: |
    SELECT ROUND(AVG(CAST(DATEDIFF(day, p.first_release_date, CONVERT(date, CONVERT(char(8), f.date_key), 112)) AS decimal(18,4))), 2) AS avg_days_since_release
    FROM dw.fact_sales f
    JOIN dw.dim_product p ON p.product_key = f.product_key
    WHERE f.date_key BETWEEN 20150101 AND 20151231
      AND p.product_kind = 'game'
      AND p.first_release_date <= CONVERT(date, CONVERT(char(8), f.date_key), 112)
  draft:
    kind: period
    seed: dw.fact_sales
    check: ok
    rows: 1
    columns: [avg_days_since_release]
    preview:
    - ['1011.030000']
