- id: d16
  status: draft
  question: Which 5 game titles sold the most units in 2015, each title pooled across all of its platforms?
    List the title and its total quantity sold, largest first, breaking ties alphabetically by title.
    Count every sales line of the year as recorded, including return lines with negative quantities.
  expect: answer
  objects: [dw.dim_product, dw.fact_sales]
  identify_by: [title]
  rank_by: total_quantity
  order_matters: true
  notes: Returns carry negative quantity, so the sum gives net units; product_kind = 'game' is read from
    the values shown, and a title selling on several platforms is counted once.
  sql: |
    SELECT TOP (5) p.title, SUM(f.quantity) AS total_quantity
