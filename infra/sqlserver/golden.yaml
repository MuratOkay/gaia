- id: d27
  status: draft
  question: Of the payroll runs paid during 2015 that are not voided, what percentage used a payroll currency
    different from the country's default currency? Give the percentage as a number rounded to 2 decimals,
    counting each run once; runs whose country has no matching country record count in the total but not
    in the differing part.
  expect: answer
  objects: [dbo.countries, hr.payroll_runs]
  notes: void is read as voided; the percentage compares each run's payroll currency with its country's
    default currency, and missing country records are assumed rare but handled in the denominator.
  sql: |
    SELECT ROUND(100.0 * SUM(CASE WHEN c.default_currency IS NOT NULL AND r.currency_code <> c.default_currency THEN 1 ELSE 0 END) / COUNT(*), 2) AS percentage FROM hr.payroll_runs r LEFT JOIN dbo.countries c ON c.country_code = r.country_code WHERE r.paid_at >= '2015-01-01' AND r.paid_at < '2016-01-01' AND r.status <> 'void'
  draft:
    kind: ratio
    seed: hr.payroll_runs
    check: ok
    rows: 1
    columns: [percentage]
    preview:
    - [0E-12]
