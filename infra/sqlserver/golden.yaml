- id: d04
  status: draft
  question: Which 5 publishers brought in the most sales revenue in US dollars during 2015? List each
    publisher with its total revenue, largest first, breaking ties alphabetically by publisher name. Count
    every sales line of the year as recorded, including return lines with negative quantities.
  expect: answer
  objects: [dw.dim_product, dw.sales_wide]
  identify_by: [publisher]
  rank_by: total_revenue_usd
  order_matters: true
  notes: Product key is unique in the catalogue, so the join does not multiply sales lines; hardware items
    without a publisher form their own blank group.
  sql: |
    SELECT TOP (5) p.publisher, SUM(s.line_total_usd) AS total_revenue_usd
    FROM dw.sales_wide s
    JOIN dw.dim_product p ON s.product_key = p.product_key
    WHERE s.date_key >= 20150101 AND s.date_key <= 20151231
    GROUP BY p.publisher
    ORDER BY SUM(s.line_total_usd) DESC, p.publisher ASC
  draft:
    kind: ranking
    seed: dw.sales_wide
    check: ok
    rows: 5
    columns: [publisher, total_revenue_usd]
    preview:
    - [None, '10384385.3381']
    - [Nintendo, '553887.4387']
    - [Sony Computer Entertainment, '416296.0988']
    - [Ubisoft, '347383.2862']
    - [Activision, '331760.1026']
- id: d05
  status: draft
  question: What percentage of the total sales revenue in US dollars for 2015 came from hardware items
    rather than games? Give the percentage as a number rounded to 2 decimals, over all 2015 sales lines
    including returns with negative quantities.
  expect: answer
  objects: [dw.dim_product, dw.sales_wide]
  notes: Product kind is read from its two catalogue values 'game' and 'hardware'; the share can exceed
    100 or fall below 0 because return lines carry negative amounts.
  sql: |
    SELECT CAST(100.0 * SUM(CASE WHEN p.product_kind = 'hardware' THEN s.line_total_usd ELSE 0 END)
                / NULLIF(SUM(s.line_total_usd), 0) AS decimal(10,2)) AS hardware_revenue_percentage
    FROM dw.sales_wide s
    JOIN dw.dim_product p ON s.product_key = p.product_key
    WHERE s.date_key >= 20150101 AND s.date_key <= 20151231
  draft:
    kind: ratio
    seed: dw.sales_wide
    check: ok
    rows: 1
    columns: [hardware_revenue_percentage]
    preview:
    - ['51.79']
