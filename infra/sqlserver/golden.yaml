  status: draft
  question: What percentage of the reviews posted during 2015 received at least one helpful vote at any
    time? Give the percentage as a number rounded to 2 decimals, counting each review of 2015 once in
    the total and once in the helpful part if it has ever been marked helpful.
  expect: answer
  objects: [web.review_votes, web.reviews]
  notes: '''helpful'' is read from the reaction type values; the vote date is not restricted, so a later
    helpful vote still counts, and a review with several helpful votes is counted once.'
