- id: d07
  status: draft
  question: Which 5 departments had the highest total gross pay across all payroll lines on record? List
    each department identifier with its total gross pay and number of payroll lines, largest total gross
    pay first; break ties by the lower department identifier.
  expect: answer
  objects: [hr.employment_spells, hr.payroll_lines]
  identify_by: [department_id]
  rank_by: total_gross_pay
  order_matters: true
  notes: Department comes from the employment spell; gross pay is summed over every payroll line on record,
    with no date filter because payroll lines have no payroll date column.
  sql: |
    WITH dept_pay AS (
      SELECT es.department_id,
             SUM(pl.gross) AS total_gross_pay,
             COUNT(*) AS payroll_lines
      FROM hr.payroll_lines pl
      JOIN hr.employment_spells es ON es.spell_id = pl.spell_id
      GROUP BY es.department_id
    )
    SELECT TOP (5) department_id, total_gross_pay, payroll_lines
    FROM dept_pay
    ORDER BY total_gross_pay DESC, department_id ASC;
  draft:
    kind: ranking
    seed: hr.employment_spells
    check: ok
    rows: 5
    columns: [department_id, total_gross_pay, payroll_lines]
    preview:
    - ['1', '276025857.94', '81874']
    - ['3', '20040481.60', '11641']
    - ['2', '18929295.11', '4686']
    - ['7', '18598104.04', '7881']
    - ['5', '18487221.95', '3366']
- id: d08
  status: draft
  question: For each calendar month of 2015, what were the total hours worked across all staff shifts
    that started in that month, after deducting the recorded break time? Give hours rounded to 2 decimals,
    in calendar order from January to December.
  expect: answer
  objects: [hr.staff_shifts]
  identify_by: [month_label]
  order_matters: true
  notes: Hours are elapsed shift minutes minus break_minutes, grouped by the month in which the shift
    started; shifts starting in 2015 only.
  sql: |
    SELECT CONVERT(char(7), s.shift_start, 120) AS month_label,
           CAST(ROUND(SUM(DATEDIFF(MINUTE, s.shift_start, s.shift_end) - s.break_minutes) / 60.0, 2) AS decimal(12,2)) AS hours_worked
    FROM hr.staff_shifts s
    WHERE s.shift_start >= '2015-01-01' AND s.shift_start < '2016-01-01'
    GROUP BY CONVERT(char(7), s.shift_start, 120)
    ORDER BY month_label;
  draft:
    kind: period
    seed: hr.employment_spells
    check: ok
    rows: 12
    columns: [month_label, hours_worked]
    preview:
