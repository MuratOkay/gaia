- id: d01
  status: draft
  question: For trade-ins recorded in 2015 that are linked to a sales transaction, how many days on average
    passed between the trade-in and that sale (sale date minus trade-in date)? Round the average to 2
    decimals; trade-ins without a linked sale do not count.
  expect: answer
  objects: [dbo.trade_ins, dbo.transactions]
  notes: Sign convention is sale minus trade-in, so a negative value means the sale preceded the trade-in;
    occurred_at precision varies by source system.
  sql: |
    SELECT ROUND(AVG(CAST(DATEDIFF(day, ti.occurred_at, t.occurred_at) AS decimal(10, 2))), 2) AS avg_days FROM dbo.trade_ins ti JOIN dbo.transactions t ON t.transaction_id = ti.transaction_id WHERE ti.occurred_at >= '2015-01-01' AND ti.occurred_at < '2016-01-01'
  draft:
    kind: period
    seed: dbo.source_systems
    check: ok
    rows: 1
    columns: [avg_days]
    preview:
    - ['0.000000']
- id: d02
  status: draft
  question: What percentage of web page views in 2015 received an HTTP 404 response? Give the percentage
    as a number rounded to 2 decimals, over all page views of that year.
  expect: answer
  objects: [web.page_views]
  notes: http_status is a numeric code column; 404 is read as 'not found', all other statuses count as
    the remainder.
  sql: |
    SELECT ROUND(100.0 * SUM(CASE WHEN pv.http_status = 404 THEN 1 ELSE 0 END) / COUNT(*), 2) AS not_found_percentage FROM web.page_views pv WHERE pv.occurred_at >= '2015-01-01' AND pv.occurred_at < '2016-01-01'
  draft:
    kind: ratio
    seed: dbo.source_systems
    check: ok
    rows: 1
    columns: [not_found_percentage]
    preview:
    - ['2.500000000000']
