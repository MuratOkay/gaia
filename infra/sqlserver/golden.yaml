- id: d09
  status: draft
  question: What percentage of sales transactions that occurred in 2015 were linked to at least one trade-in
    on record, regardless of the trade-in date? Give the percentage as a number rounded to 2 decimals,
    counting each 2015 sales transaction once.
  expect: answer
  objects: [dbo.trade_ins, dbo.transactions]
  notes: Denominator is every 2015 transaction header; trade-ins with no linked transaction are excluded
    from the numerator, and multiple trade-ins for one sale count once.
  sql: |
    WITH sales_2015 AS (
      SELECT t.transaction_id
      FROM dbo.transactions t
      WHERE t.occurred_at >= '2015-01-01' AND t.occurred_at < '2016-01-01'
    ),
    linked AS (
      SELECT DISTINCT ti.transaction_id
      FROM dbo.trade_ins ti
      WHERE ti.transaction_id IS NOT NULL
    )
    SELECT CAST(ROUND(100.0 * COUNT(l.transaction_id) / COUNT(*), 2) AS decimal(5,2)) AS percentage_linked
    FROM sales_2015 s
    LEFT JOIN linked l ON l.transaction_id = s.transaction_id;
  draft:
    kind: ratio
    seed: hr.employment_spells
    check: ok
    rows: 1
    columns: [percentage_linked]
    preview:
    - ['9.99']
